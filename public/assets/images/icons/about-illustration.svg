<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <!-- Modern flat vector illustration for About BhoomiSetu -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="260" height="180" rx="16" fill="url(#bgGrad)" opacity="0.6"/>
  <!-- Central GIS Server / Building -->
  <rect x="90" y="50" width="100" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Roof / Flag -->
  <polygon points="140,25 90,50 190,50" fill="#002147"/>
  <line x1="140" y1="25" x2="140" y2="12" stroke="#FF9933" stroke-width="2"/>
  <polygon points="140,12 155,16 140,20" fill="#FF9933"/>
  <!-- Windows / Pillars -->
  <rect x="102" y="65" width="18" height="24" rx="2" fill="#e2e8f0"/>
  <rect x="131" y="65" width="18" height="24" rx="2" fill="#e2e8f0"/>
  <rect x="160" y="65" width="18" height="24" rx="2" fill="#e2e8f0"/>
  <!-- Door / Terminal -->
  <rect x="125" y="110" width="30" height="50" rx="4" fill="#002147"/>
  <!-- Characters collaborating -->
  <!-- Person 1 Left with Tablet -->
  <circle cx="55" cy="95" r="14" fill="#f87171"/>
  <rect x="42" y="115" width="26" height="50" rx="6" fill="#3b82f6"/>
  <rect x="60" y="120" width="16" height="22" rx="2" fill="#1e293b"/>
  <!-- Person 2 Right with Laptop -->
  <circle cx="225" cy="95" r="14" fill="#34d399"/>
  <rect x="212" y="115" width="26" height="50" rx="6" fill="#f59e0b"/>
  <polygon points="195,135 215,135 220,145 190,145" fill="#64748b"/>
  <!-- Digital Land Records / Checkmarks floating -->
  <circle cx="65" cy="50" r="15" fill="#138808"/>
  <path d="M 58 50 L 63 55 L 72 45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="45" r="15" fill="#FF9933"/>
  <path d="M 207 45 L 223 45 M 215 37 L 215 53" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
