<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <!-- Modern vector illustration showing Citizen using Digital Land Portal on big monitor -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Big Display Monitor -->
  <rect x="30" y="20" width="180" height="120" rx="8" fill="url(#screenGrad)" stroke="#64748b" stroke-width="3"/>
  <rect x="36" y="26" width="168" height="108" rx="4" fill="#ffffff"/>
  <!-- Monitor Stand -->
  <rect x="105" y="140" width="30" height="35" fill="#475569"/>
  <ellipse cx="120" cy="175" rx="40" ry="8" fill="#334155"/>
  <!-- UI Inside Monitor -->
  <rect x="44" y="34" width="152" height="16" rx="3" fill="#e2e8f0"/>
  <circle cx="52" cy="42" r="3" fill="#ef4444"/>
  <circle cx="60" cy="42" r="3" fill="#f59e0b"/>
  <circle cx="68" cy="42" r="3" fill="#10b981"/>
  <!-- Map Cadastral Grid on Monitor -->
  <rect x="44" y="56" width="90" height="68" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <path d="M 50 70 L 80 65 L 125 75 L 115 110 L 55 105 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="85" cy="85" r="4" fill="#dc2626"/>
  <!-- Upload / Search Dialog on Monitor -->
  <rect x="140" y="56" width="56" height="68" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="168" cy="80" r="10" fill="#e0e7ff"/>
  <path d="M 168 75 L 168 85 M 163 80 L 173 80" stroke="#4f46e5" stroke-width="2"/>
  <text x="168" y="105" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#64748b" text-anchor="middle">Add Land Plot</text>
  <!-- Citizen standing next to screen pointing -->
  <circle cx="230" cy="70" r="14" fill="#fb7185"/>
  <!-- Hair / attire -->
  <path d="M 218 64 C 220 50 240 50 242 64 Z" fill="#0f172a"/>
  <!-- Body dress -->
  <path d="M 215 88 L 245 88 L 250 170 L 210 170 Z" fill="#f43f5e"/>
  <!-- Pointing arm towards screen -->
  <path d="M 220 100 L 195 85" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
</svg>
