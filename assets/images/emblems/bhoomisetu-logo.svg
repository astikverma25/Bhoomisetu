<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E6206"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark: Cadastral Land & Bridge / Setu Icon -->
  <g transform="translate(10, 10)">
    <!-- Land Parcel Polygons (GIS style) -->
    <path d="M 10 30 L 30 12 L 50 20 L 40 45 L 18 48 Z" fill="#FF9933" opacity="0.9"/>
    <path d="M 30 12 L 55 5 L 65 24 L 50 20 Z" fill="#138808" opacity="0.85"/>
    <path d="M 40 45 L 50 20 L 65 24 L 60 52 L 32 55 Z" fill="#002147" opacity="0.9"/>
    <!-- Setu / Connecting Bridge Arc -->
    <path d="M 5 38 Q 35 15 65 38" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 5 44 Q 35 22 65 44" stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Location Geopin -->
    <circle cx="35" cy="18" r="5" fill="#E65100" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="18" r="2" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 28)">
    <text x="0" y="0" font-family="'Outfit', 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#002147" letter-spacing="-0.5">
      भूमि <tspan fill="#E65100">सेतु</tspan> <tspan font-family="'Outfit', sans-serif" font-weight="700" font-size="20" fill="#138808">| BhoomiSetu</tspan>
    </text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#444444" letter-spacing="0.4">
      NATIONAL INTEGRATED LAND & REVENUE PORTAL
    </text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#777777">
      Department of Land Resources • Ministry of Rural Development, Govt. of India
    </text>
  </g>
</svg>
