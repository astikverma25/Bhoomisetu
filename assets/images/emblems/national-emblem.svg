<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="ashokaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b60"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
  </defs>
  <!-- Ashoka Lions Profile stylized -->
  <g fill="url(#ashokaBlue)" stroke="#002147" stroke-width="0.5">
    <!-- Center Lion Head -->
    <path d="M 80 15 C 72 15 65 22 65 32 C 65 38 68 45 70 50 C 66 52 62 58 62 65 C 62 75 70 82 80 82 C 90 82 98 75 98 65 C 98 58 94 52 90 50 C 92 45 95 38 95 32 C 95 22 88 15 80 15 Z" fill="url(#ashokaBlue)"/>
    <!-- Left Lion Head -->
    <path d="M 62 25 C 55 25 48 30 46 38 C 44 44 46 50 48 55 C 44 58 40 64 42 72 C 44 80 52 86 60 86 C 62 86 65 84 66 82 C 60 76 58 68 60 60 C 60 52 64 45 66 40 C 64 33 63 28 62 25 Z" fill="url(#ashokaBlue)"/>
    <!-- Right Lion Head -->
    <path d="M 98 25 C 105 25 112 30 114 38 C 116 44 114 50 112 55 C 116 58 120 64 118 72 C 116 80 108 86 100 86 C 98 86 95 84 94 82 C 100 76 102 68 100 60 C 100 52 96 45 94 40 C 96 33 97 28 98 25 Z" fill="url(#ashokaBlue)"/>
    <!-- Mane details & facial features -->
    <circle cx="74" cy="40" r="2.5" fill="#ffffff"/>
    <circle cx="86" cy="40" r="2.5" fill="#ffffff"/>
    <polygon points="80,48 76,55 84,55" fill="#ffffff"/>
    <path d="M 72 63 Q 80 70 88 63" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M 50 46 Q 54 50 56 46" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <path d="M 110 46 Q 106 50 104 46" stroke="#ffffff" stroke-width="1.5" fill="none"/>

    <!-- Chest and Torso -->
    <path d="M 55 84 L 105 84 L 112 120 L 48 120 Z" fill="url(#ashokaBlue)"/>
    <!-- Mane curls -->
    <path d="M 60 90 Q 70 98 60 106 M 80 88 Q 80 98 80 112 M 100 90 Q 90 98 100 106 M 70 95 Q 80 102 70 115 M 90 95 Q 80 102 90 115" stroke="#d4af37" stroke-width="2" fill="none"/>

    <!-- Abacus / Platform -->
    <rect x="30" y="122" width="100" height="26" rx="3" fill="#002147"/>
    
    <!-- Ashoka Chakra on Abacus -->
    <circle cx="80" cy="135" r="10" fill="#ffffff" stroke="#002147" stroke-width="1.5"/>
    <circle cx="80" cy="135" r="2" fill="#002147"/>
    <!-- 24 spokes -->
    <g stroke="#002147" stroke-width="0.8">
      <line x1="80" y1="125" x2="80" y2="145"/>
      <line x1="70" y1="135" x2="90" y2="135"/>
      <line x1="73" y1="128" x2="87" y2="142"/>
      <line x1="73" y1="142" x2="87" y2="128"/>
      <line x1="76" y1="126" x2="84" y2="144"/>
      <line x1="84" y1="126" x2="76" y2="144"/>
      <line x1="71" y1="131" x2="89" y2="139"/>
      <line x1="71" y1="139" x2="89" y2="131"/>
    </g>
    <!-- Galloping Horse on left -->
    <path d="M 42 138 C 45 130 52 130 54 135 C 56 138 52 142 46 142 Z" fill="#ffffff"/>
    <!-- Bull on right -->
    <path d="M 118 138 C 115 130 108 130 106 135 C 104 138 108 142 114 142 Z" fill="#ffffff"/>

    <!-- Bell shaped lotus base -->
    <path d="M 35 150 C 45 148 115 148 125 150 C 130 160 120 170 80 172 C 40 170 30 160 35 150 Z" fill="url(#ashokaBlue)"/>
    <path d="M 45 153 Q 80 165 115 153" stroke="#d4af37" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Satyameva Jayate in Devanagari script -->
  <text x="80" y="195" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', serif" font-size="15" font-weight="bold" fill="#002147" text-anchor="middle" letter-spacing="1">सत्यमेव जयते</text>
  <text x="80" y="210" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="0.5">GOVERNMENT OF INDIA</text>
</svg>
